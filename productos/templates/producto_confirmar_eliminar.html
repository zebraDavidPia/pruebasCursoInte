{% extends 'base.html' %}
{% block content %}
<div class="mt-4">
    <h4>¿Eliminar producto?</h4>
    <p>¿Estás seguro de que deseas eliminar <strong>{{producto.nombre}}</strong>?</p>
    <form method='POST'>
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Sí, eliminar</button>
        <a class="btn btn-secondary" href="{% url 'productos:detalle' producto.id %}">Cancelar</a>
    </form>
</div>
{% endblock %}
