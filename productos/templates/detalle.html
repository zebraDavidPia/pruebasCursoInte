{% extends 'base.html' %}
{% block content %}
<div>
    <h6>{{producto.nombre}}</h6>
    <p>{{producto.categoria}}</p>
    <p>{{producto.stock}}</p>
    <p>{{producto.puntaje}}</p>
    <p>{{producto.creado_en}}</p>
    <a class="btn btn-primary" href="{% url 'productos:editar' producto.id %}">Editar</a>
    <a class="btn btn-danger" href="{% url 'productos:eliminar' producto.id %}">Eliminar</a>
</div>
{% endblock%}
